<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multiplayer UX — Flow Storyboards</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Multiplayer UX — Flow Storyboards</strong>
      <span class="sub">wireframes · theme-agnostic · design spike</span>
      <span id="mode-badge" class="sub" style="font-family:var(--mono);font-size:11px"></span>
    </div>
    <div class="tools">
      <button id="zoom-out" class="tbtn" title="zoom out">–</button>
      <span id="zoompct" class="zoompct">70%</span>
      <button id="zoom-in" class="tbtn" title="zoom in">＋</button>
      <button id="fit" class="tbtn" title="fit to screen">Fit</button>
    </div>
  </header>

  <!-- Key toggle: hamburger below the nav bar (Key is closed by default) -->
  <button id="menu-fab" title="show the Key / legend">☰</button>

  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <svg id="edges" class="edges" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- nodes injected by app.js -->
    </div>
    <div class="hint">drag to pan · scroll to zoom · <b>Fit</b> to frame all · ☰ opens the Key (hover a color to glow it)</div>
  </div>

  <!-- floating select-tool stack, by the notes bar -->
  <div id="tool-fabs">
    <button id="fab-select" class="fab" title="Select mode — click any card to select it">⊹</button>
    <button id="fab-marquee" class="fab" title="Drag-select — drag a box over the canvas to select cards">▧</button>
    <button id="fab-clear" class="fab clear" title="Clear selection">✕</button>
  </div>

  <aside id="legend" class="panel legend">
    <div class="panel-h">Key <span class="panel-sub">how to read the map</span></div>
    <div id="legend-body"></div>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
