<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multiplayer UX — Flow Storyboards</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- hamburger: left of the nav bar, opens the Key side panel -->
      <button id="nav-menu" title="show the Key / legend" aria-label="Open Key panel">
        <svg viewBox="0 0 32 32" fill="currentColor"><path d="M4 6h24v2H4zM4 15h24v2H4zM4 24h24v2H4z"/></svg>
      </button>
      <div class="brand-txt">
        <strong>Multiplayer UX — Flow Storyboards</strong>
        <span class="sub">wireframes · theme-agnostic · design spike</span>
        <span id="mode-badge" class="sub" style="font-family:var(--mono);font-size:11px"></span>
      </div>
    </div>
    <div class="tools">
      <button id="zoom-out" class="tbtn" title="zoom out">–</button>
      <span id="zoompct" class="zoompct">70%</span>
      <button id="zoom-in" class="tbtn" title="zoom in">＋</button>
      <button id="fit" class="tbtn" title="scale to fit everything">Fit</button>
      <button id="center" class="tbtn" title="center the canvas (keeps zoom)">Center</button>
      <button id="reset" class="tbtn" title="reset view — center + fit">Reset</button>
    </div>
  </header>

  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <svg id="edges" class="edges" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- nodes injected by app.js -->
    </div>
    <div class="hint">drag to pan · scroll to zoom · <b>Fit</b> to frame all · menu (top-left) opens the Key</div>
  </div>

  <!-- select-tool stack, beside the comment area -->
  <div id="tool-fabs">
    <button id="fab-select" class="fab" title="Select mode — click any card to select it">
      <svg viewBox="0 0 32 32" fill="currentColor"><path d="M10 4v22l5.6-5.6L19 28l2.8-1.2-3.4-7.2H26z"/></svg>
    </button>
    <button id="fab-marquee" class="fab" title="Drag-select — drag a box over the canvas to select cards">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="5" y="5" width="22" height="22" rx="1.5" stroke-dasharray="5 4"/></svg>
    </button>
    <button id="fab-clear" class="fab clear" title="Clear selection">
      <svg viewBox="0 0 32 32" fill="currentColor"><path d="M24 9.4L22.6 8 16 14.6 9.4 8 8 9.4 14.6 16 8 22.6 9.4 24 16 17.4 22.6 24 24 22.6 17.4 16z"/></svg>
    </button>
  </div>

  <aside id="legend" class="panel legend">
    <div class="panel-h">Key <span class="panel-sub">how to read the map</span></div>
    <div id="legend-body"></div>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
