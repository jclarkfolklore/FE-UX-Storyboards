<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Storyboards</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- key icon: opens the Key side panel -->
      <button id="nav-menu" title="show the Key / legend" aria-label="Open Key panel">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="21" cy="11" r="6" /><path d="M16.8 15.2 6 26M9 23l3 3M12 20l3 3" />
        </svg>
      </button>
      <strong id="board-title">Storyboards</strong>
    </div>

    <!-- centered, standout Info button -->
    <button id="info-btn" title="what is this / why it matters">
      <svg class="ic" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2Zm0 26a12 12 0 1 1 12-12 12 12 0 0 1-12 12Z"/><path d="M15 14h2v8h-2z"/><circle cx="16" cy="10.5" r="1.25"/></svg>
      What is this?
    </button>

    <div class="tools">
      <button id="zoom-out" class="tbtn" title="zoom out">–</button>
      <span id="zoompct" class="zoompct">70%</span>
      <button id="zoom-in" class="tbtn" title="zoom in">＋</button>
      <button id="fit" class="tbtn" title="scale to fit everything">Fit</button>
      <button id="center" class="tbtn" title="center the canvas (keeps zoom)">Center</button>
      <button id="reset" class="tbtn" title="reset view — center + fit">Reset</button>
    </div>
  </header>

  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <svg id="edges" class="edges" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- nodes injected by app.js -->
    </div>
    <div class="hint">drag to pan · scroll or ⌘-drag to zoom</div>
  </div>

  <!-- select-tool stack, beside the comment area (labels expand on hover) -->
  <div id="tool-fabs">
    <button id="fab-select" class="fab">
      <svg viewBox="0 0 32 32" fill="currentColor"><path d="M10 4v22l5.6-5.6L19 28l2.8-1.2-3.4-7.2H26z"/></svg>
      <span class="fab-label">Click a card to select</span>
    </button>
    <button id="fab-marquee" class="fab">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="5" y="5" width="22" height="22" rx="1.5" stroke-dasharray="5 4"/></svg>
      <span class="fab-label">Drag a box to select</span>
    </button>
    <button id="fab-clear" class="fab clear" disabled>
      <svg viewBox="0 0 32 32" fill="currentColor"><path d="M24 9.4L22.6 8 16 14.6 9.4 8 8 9.4 14.6 16 8 22.6 9.4 24 16 17.4 22.6 24 24 22.6 17.4 16z"/></svg>
      <span class="fab-label">Clear selection</span>
    </button>
  </div>

  <aside id="legend" class="panel legend">
    <div class="panel-h">Key <span class="panel-sub">how to read the map</span></div>
    <div id="legend-body"></div>
  </aside>

  <!-- view-only ribbon (deployed static build) -->
  <div id="viewonly-flag" hidden>VIEW ONLY · read-only presentation</div>

  <!-- Info: what this is / why it matters — content comes from BOARD in frames.js -->
  <div id="info-modal" class="modal" hidden>
    <div class="modal-card">
      <button id="info-close" class="modal-close" aria-label="Close">
        <svg viewBox="0 0 32 32" fill="currentColor"><path d="M24 9.4L22.6 8 16 14.6 9.4 8 8 9.4 14.6 16 8 22.6 9.4 24 16 17.4 22.6 24 24 22.6 17.4 16z"/></svg>
      </button>
      <div class="modal-eyebrow" id="info-eyebrow"></div>
      <div id="info-body"></div>
      <div class="modal-meta"><span id="info-meta"></span> · <span id="info-mode"></span></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
